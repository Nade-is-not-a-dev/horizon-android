# The source exporter restores the Android checks and dev APK workflows.
name: Android source checks
on:
  push:
    branches: [android]
  pull_request:
    branches: [android]
  workflow_dispatch:
    inputs:
      native_checks:
        description: Type-check all four Android ABIs (slower)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: git diff --check
      - run: python3 tools/check_public_tree.py --history
      - run: python3 -m unittest discover -s tests -p 'test_android*.py'
      - run: python3 tools/test_android_diagnostics.py
      - run: python3 tools/test_android_performance.py
      - run: python3 tools/test_android_content.py
      - run: python3 tools/test_android_appearance.py
      - name: Check workflow export matches the active workflow
        run: |
          cmp .github/workflows/android-source.yml packaging/android/source-checks.yml
          cmp .github/workflows/android-dev.yml packaging/android/dev-builds.yml
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.native_checks
    needs: source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - abi: arm64-v8a
            target: aarch64-linux-android
          - abi: armeabi-v7a
            target: armv7-linux-androideabi
          - abi: x86
            target: i686-linux-android
          - abi: x86_64
            target: x86_64-linux-android
    env:
      HORIZON_TELEMETRY_URL: "off"
      CARGO_TARGET_DIR: .local/ci-target
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Android toolchain
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager" ]]; then
            sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)
          fi
          test -x "$sdkmanager"
          "$sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;28.2.13676358" "build-tools;35.0.0"
          rustup target add "${{ matrix.target }}"
      - name: Check Android Rust code without building an APK
        run: python3 tools/android_build.py --abi "${{ matrix.abi }}" --check --public --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME_17_X64" --ndk-version 28.2.13676358 --build-tools-version 35.0.0
  notify:
    needs: [source, native]
    if: always() && needs.source.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_RESULT: ${{ needs.source.result }}
      NATIVE_RESULT: ${{ needs.native.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Send the result summary to Telegram
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not set; skipping the notification."
            exit 0
          fi
          head_sha="${{ github.sha }}"
          short="${head_sha:0:9}"
          prev=$(gh api "repos/${{ github.repository }}/actions/workflows/android-source.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.status == \"completed\" and .head_sha != \"$head_sha\")][0].head_sha // empty")
          changes=""
          if [ -n "$prev" ]; then
            changes=$(gh api "repos/${{ github.repository }}/compare/$prev...$head_sha" \
              --jq '.commits[] | .commit.message | split("\n")[0]' 2>/dev/null | head -25 | sed 's/^/- /' || true)
          fi
          if [ -z "$changes" ]; then
            changes=$(gh api "repos/${{ github.repository }}/commits/$head_sha" --jq '.commit.message' | head -1 | sed 's/^/- /')
          fi
          changes=$(printf '%s' "$changes" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g')
          if [ "$SOURCE_RESULT" = "success" ] && { [ "$NATIVE_RESULT" = "success" ] || [ "$NATIVE_RESULT" = "skipped" ]; }; then
            status="✅ <b>Cek sumber berhasil</b>"
          else
            status="❌ <b>Cek sumber gagal</b> (source: $SOURCE_RESULT, native: $NATIVE_RESULT)"
          fi
          text=$(printf '%s\nBranch: <code>%s</code>\nCommit: <code>%s</code>\n\n<b>Perubahan:</b>\n%s' \
            "$status" "${{ github.ref_name }}" "$short" "$changes")
          jq -n --arg chat "$TELEGRAM_CHAT_ID" --arg text "$text" --arg url "$RUN_URL" \
            '{chat_id: $chat, text: $text, parse_mode: "HTML",
              reply_markup: {inline_keyboard: [[{text: "📋 Lihat hasil cek", url: $url}]]}}' \
            | curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
                -H 'Content-Type: application/json' -d @- > /dev/null
          echo "Summary sent."
